<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MigraTrack</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef2ff, #f8faff);
            color: #1e293b;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: -200px;
            right: -200px;
            width: 450px;
            height: 450px;
            background: #6366f1;
            opacity: .12;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            bottom: -200px;
            left: -200px;
            width: 450px;
            height: 450px;
            background: #8b5cf6;
            opacity: .12;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
        }

        .screen {
            display: none;
            min-height: 100vh;
        }

        .active {
            display: block;
        }

        .login-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {

            background: rgba(255, 255, 255, .95);

            backdrop-filter: blur(15px);

            padding: 40px;

            border-radius: 30px;

            box-shadow:
                0 20px 50px rgba(79, 70, 229, .12);

            width: 100%;
            max-width: 430px;

        }

        .logo {

            font-size: 42px;

            font-weight: 800;

            text-align: center;

            margin-bottom: 10px;

            background:
                linear-gradient(90deg,
                    #4f46e5,
                    #7c3aed);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        input,
        textarea,
        select {

            width: 100%;

            padding: 15px;

            margin-top: 12px;

            border: 1px solid #e2e8f0;

            border-radius: 15px;

            background: white;

            transition: .3s;

        }

        input:focus,
        textarea:focus,
        select:focus {

            outline: none;

            border-color: #6366f1;

            box-shadow:
                0 0 0 4px rgba(99, 102, 241, .1);

        }

        button {

            width: 100%;

            padding: 15px;

            margin-top: 15px;

            border: none;

            border-radius: 15px;

            background:
                linear-gradient(135deg,
                    #4f46e5,
                    #6366f1);

            color: white;

            cursor: pointer;

            font-weight: 600;

            transition: .3s;

        }

        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 20px rgba(79, 70, 229, .25);

        }

        header {

            background:
                rgba(255, 255, 255, .9);

            backdrop-filter: blur(15px);

            padding: 18px 25px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, .05);

            position: sticky;

            top: 0;

            z-index: 100;

        }

        .app-content {
            padding: 25px;
            padding-bottom: 120px;
            max-width: 1300px;
            margin: auto;
        }

        .welcome {
            font-size: 34px;
            font-weight: 800;
        }

        .info {
            margin-top: 5px;
            color: #64748b;
        }

        .grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));

            gap: 20px;

            margin-top: 25px;

        }

        .data-card {

            background: white;

            padding: 25px;

            border-radius: 25px;

            box-shadow:
                0 10px 30px rgba(79, 70, 229, .08);

            transition: .3s;

        }

        .data-card:hover {
            transform: translateY(-5px);
        }

        .data-card h3 {
            color: #64748b;
            font-size: 14px;
        }

        .data-card h2 {
            margin-top: 10px;
            font-size: 28px;
            color: #4f46e5;
        }

        .section {
            margin-top: 35px;
        }

        .insight {

            background:
                linear-gradient(135deg,
                    white,
                    #f5f3ff);

            padding: 20px;

            border-left: 5px solid #4f46e5;

            border-radius: 20px;

            margin-top: 15px;

            box-shadow:
                0 10px 25px rgba(79, 70, 229, .08);

        }

        .page {
            display: none;
        }

        .page.active-page {
            display: block;
        }

        .registro-card {

            background: white;

            padding: 20px;

            border-radius: 20px;

            margin-top: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, .06);

        }

        .registro-card h4 {
            color: #4f46e5;
            margin-bottom: 10px;
        }

        .nav {

            position: fixed;

            bottom: 15px;

            left: 50%;

            transform: translateX(-50%);

            width: 95%;

            max-width: 700px;

            background: white;

            display: flex;

            justify-content: space-around;

            padding: 15px;

            border-radius: 25px;

            box-shadow:
                0 15px 30px rgba(79, 70, 229, .15);

        }

        .nav button {

            background: none;

            box-shadow: none;

            width: auto;

            margin: 0;

            font-size: 20px;

            color: #4f46e5;

        }

        @media(max-width:768px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .welcome {
                font-size: 28px;
            }

            .card {
                padding: 30px;
            }

            .app-content {
                padding: 15px;
                padding-bottom: 120px;
            }

        }
    </style>

</head>

<body>

    <!-- LOGIN -->
    <div id="loginScreen" class="screen active">

        <div class="login-container">

            <div class="card">

                <div class="logo">MigraTrack</div>

                <p class="subtitle">
                    Entenda sua saúde através dos seus hábitos.
                </p>

                <input id="loginEmail" type="email" placeholder="E-mail">

                <input id="loginSenha" type="password" placeholder="Senha">

                <button onclick="entrar()">
                    Entrar
                </button>

                <button onclick="abrirCadastro()">
                    Criar Conta
                </button>

            </div>

        </div>

    </div>

    <!-- CADASTRO -->

    <div id="cadastroScreen" class="screen">

        <div class="login-container">

            <div class="card">

                <div class="logo">Cadastro</div>

                <input id="cadNome" placeholder="Nome completo">

                <input id="cadIdade" placeholder="Idade">

                <input id="cadEmail" placeholder="E-mail">

                <input id="cadSenha" type="password" placeholder="Senha">

                <button onclick="cadastrar()">
                    Cadastrar
                </button>

            </div>

        </div>

    </div>

    <!-- APP -->

    <div id="appScreen" class="screen">

        <header>

            <h2>🧠 MigraTrack</h2>

            <div id="nomeUsuario"></div>

        </header>

        <div class="app-content">

            <!-- DASHBOARD -->

            <div id="dashboard" class="page active-page">

                <h1 class="welcome">
                    Olá 👋
                </h1>

                <p class="info">
                    Acompanhe sua saúde diariamente.
                </p>

                <div class="grid">

                    <div class="data-card">
                        <h3>📒 Registros</h3>
                        <h2 id="totalRegistros">0</h2>
                    </div>

                    <div class="data-card">
                        <h3>💧 Água Média</h3>
                        <h2 id="mediaAgua">0L</h2>
                    </div>

                    <div class="data-card">
                        <h3>😊 Humor Frequente</h3>
                        <h2 id="humorFreq">-</h2>
                    </div>

                    <div class="data-card">
                        <h3>😷 Sintomas</h3>
                        <h2 id="totalSintomas">0</h2>
                    </div>

                </div>

                <div class="section">

                    <h2>📈 Insights da IA</h2>

                    <div id="dashboardInsights"></div>

                </div>

            </div>

            <!-- NOVO REGISTRO -->

            <div id="registro" class="page">

                <h2>➕ Novo Registro</h2>

                <input id="agua" type="number" placeholder="Litros de água">

                <input id="comida" placeholder="O que você comeu hoje?">

                <input id="medicamentos" placeholder="Medicamentos tomados">

                <input id="sono" placeholder="Horas de sono">

                <input id="sintomas" placeholder="Sintomas">

                <select id="humor">
                    <option>😊 Feliz</option>
                    <option>😔 Triste</option>
                    <option>😰 Ansioso</option>
                    <option>😡 Com Raiva</option>
                    <option>😵 Estressado</option>
                </select>

                <textarea id="descricao" rows="6" placeholder="Como foi seu dia?"></textarea>

                <button onclick="salvarRegistro()">
                    Salvar Registro
                </button>

            </div>

            <!-- HISTÓRICO -->

            <div id="historico" class="page">

                <h2>📖 Histórico</h2>

                <div id="listaHistorico"></div>

            </div>

            <!-- RELATÓRIOS -->

            <div id="relatorios" class="page">

                <h2>📊 Relatório Inteligente</h2>

                <div id="relatorioCompleto"></div>

            </div>

        </div>

        <div class="nav">

            <button onclick="mostrarPagina('dashboard')">🏠</button>

            <button onclick="mostrarPagina('registro')">➕</button>

            <button onclick="mostrarPagina('historico')">📖</button>

            <button onclick="mostrarPagina('relatorios')">📈</button>

        </div>

    </div>

    <script>

        let registros = [];

        function abrirCadastro() {

            document.getElementById("loginScreen")
                .classList.remove("active");

            document.getElementById("cadastroScreen")
                .classList.add("active");

        }

        function cadastrar() {

            const usuario = {

                nome: cadNome.value,
                idade: cadIdade.value,
                email: cadEmail.value,
                senha: cadSenha.value

            };

            localStorage.setItem(
                "usuarioMigraTrack",
                JSON.stringify(usuario)
            );

            alert("✅ Cadastro realizado!");

            document.getElementById("cadastroScreen")
                .classList.remove("active");

            document.getElementById("loginScreen")
                .classList.add("active");

        }

        function entrar() {

            const usuario =
                JSON.parse(
                    localStorage.getItem("usuarioMigraTrack")
                );

            if (!usuario) {

                alert("Cadastre-se primeiro.");
                return;

            }

            if (
                usuario.email !== loginEmail.value ||
                usuario.senha !== loginSenha.value
            ) {

                alert("Dados incorretos.");
                return;

            }

            document.getElementById("loginScreen")
                .classList.remove("active");

            document.getElementById("appScreen")
                .classList.add("active");

            document.getElementById("nomeUsuario")
                .innerText = usuario.nome;

            carregarDados();

        }

        function mostrarPagina(id) {

            document.querySelectorAll(".page")
                .forEach(p => p.classList.remove("active-page"));

            document.getElementById(id)
                .classList.add("active-page");

            if (id === "relatorios") {
                gerarRelatorio();
            }

        }

        function salvarRegistro() {

            const registro = {

                data: new Date().toLocaleDateString("pt-BR"),

                agua: Number(agua.value || 0),

                comida: comida.value,

                medicamentos: medicamentos.value,

                sono: sono.value,

                sintomas: sintomas.value,

                humor: humor.value,

                descricao: descricao.value

            };

            registros.push(registro);

            localStorage.setItem(
                "registrosMigraTrack",
                JSON.stringify(registros)
            );

            agua.value = "";
            comida.value = "";
            medicamentos.value = "";
            sono.value = "";
            sintomas.value = "";
            descricao.value = "";

            carregarDados();

            alert("✅ Registro salvo!");

        }

        function carregarDados() {

            registros =
                JSON.parse(
                    localStorage.getItem("registrosMigraTrack")
                ) || [];

            atualizarDashboard();
            renderHistorico();

        }

        function atualizarDashboard() {

            totalRegistros.innerText =
                registros.length;

            if (registros.length === 0) {

                mediaAgua.innerText = "0L";
                humorFreq.innerText = "-";
                totalSintomas.innerText = "0";

                dashboardInsights.innerHTML =
                    `<div class="insight">
        📝 Faça seu primeiro registro.
        </div>`;

                return;

            }

            let aguaTotal = 0;
            let sintomas = 0;
            let humores = {};

            registros.forEach(r => {

                aguaTotal += Number(r.agua);

                if (r.sintomas.trim() !== "") {
                    sintomas++;
                }

                humores[r.humor] =
                    (humores[r.humor] || 0) + 1;

            });

            mediaAgua.innerText =
                (aguaTotal / registros.length)
                    .toFixed(1) + "L";

            totalSintomas.innerText =
                sintomas;

            let maior = 0;
            let frequente = "-";

            for (let h in humores) {

                if (humores[h] > maior) {

                    maior = humores[h];
                    frequente = h;

                }

            }

            humorFreq.innerText = frequente;

            dashboardInsights.innerHTML = `
    <div class="insight">
    💧 Média de água:
    ${(aguaTotal / registros.length).toFixed(1)}L
    </div>
    `;

        }

        function renderHistorico() {

            if (registros.length === 0) {

                listaHistorico.innerHTML =
                    `<div class="insight">
        Nenhum registro encontrado.
        </div>`;

                return;

            }

            let html = "";

            [...registros].reverse().forEach(r => {

                html += `
 
        <div class="registro-card">
 
            <h4>📅 ${r.data}</h4>
 
            <p><b>💧 Água:</b> ${r.agua}L</p>
 
            <p><b>🍎 Alimentação:</b> ${r.comida}</p>
 
            <p><b>💊 Medicamentos:</b> ${r.medicamentos}</p>
 
            <p><b>😴 Sono:</b> ${r.sono}h</p>
 
            <p><b>😷 Sintomas:</b> ${r.sintomas}</p>
 
            <p><b>😊 Humor:</b> ${r.humor}</p>
 
            <br>
 
            <p>${r.descricao}</p>
 
        </div>
        `;

            });

            listaHistorico.innerHTML = html;

        }

        function gerarRelatorio() {

            if (registros.length < 3) {

                relatorioCompleto.innerHTML = `
        <div class="insight">
        📊 Adicione pelo menos 3 registros.
        </div>
        `;

                return;

            }

            const media = (
                registros.reduce((a, b) => a + b.agua, 0)
                / registros.length
            ).toFixed(1);

            relatorioCompleto.innerHTML = `
 
    <div class="insight">
    📒 Registros analisados:
    <b>${registros.length}</b>
    </div>
 
    <div class="insight">
    💧 Consumo médio:
    <b>${media}L</b>
    </div>
 
    <div class="insight">
    🧠 Continue registrando informações para que
    o MigraTrack encontre padrões entre emoções,
    alimentação, medicamentos e sintomas.
    </div>
 
    `;

        }

    </script>

</body>

</html>
